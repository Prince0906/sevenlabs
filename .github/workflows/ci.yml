name: CI

# The single contributor-facing gate. Runs on every PR (including from forks)
# and on pushes to main. Fork-safe by design: NO secrets are read here.
# Deployment (GHCR build, EC2 SSH, prisma migrate deploy) lives in deploy.yml,
# runs main-only, and is the ONLY place secrets appear.
#
# Reproduce the whole gate locally with `npm run verify` (everything except
# schema-drift, which needs a throwaway Postgres).

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel superseded in-progress runs on the SAME PR branch to save minutes.
# main pushes are NOT cancelled (the ref is part of the group, and a main run
# finishing matters): a second push to main starts its own run instead of
# killing the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repo. No packages/checks/etc.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci # postinstall runs `prisma generate && copy:vad`
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci # `prisma generate` writes src/generated/prisma, which tsc needs
      - run: npm run typecheck

  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    # Full Vitest suite with coverage. The per-layer thresholds in
    # vitest.config.ts (TESTING.md) fail the build on a regression — a ratchet,
    # not a vanity number. This is the ONLY test job in the whole pipeline.
    env:
      SKIP_ENV_VALIDATION: "true"
      # Zod env is bypassed above; the Prisma datasource still wants a
      # syntactically valid URL when modules import it. Dummy, never connects.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage
      # vitest.config.ts always emits test-reports/junit.xml + an lcov report.
      # Keep them as an artifact for PR-failure triage (secret-free, optional).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: test-reports/

  build:
    name: Clean build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build

  schema-drift:
    name: Schema/migration drift
    runs-on: ubuntu-latest
    # Replays every committed migration into a throwaway Postgres (the service
    # below — this is the shadow DB and IS load-bearing: --from-migrations
    # connects to it to replay SQL) and diffs the result against
    # prisma/schema.prisma. Fails (exit 2) if the schema drifted from the
    # committed migrations — i.e. a `db:push` that skipped a migration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadow"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadow"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Fail if prisma/schema.prisma has drifted from committed migrations
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code
