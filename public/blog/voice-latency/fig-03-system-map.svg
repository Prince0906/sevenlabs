<line x1="720" y1="330" x2="720" y2="380" stroke="#15181E" stroke-width="2" marker-end="url(#ah-ink)"/>
<line x1="895" y1="445" x2="1030" y2="445" stroke="#15181E" stroke-width="2" marker-end="url(#ah-ink)" marker-start="url(#ah-ink)"/>
<line x1="895" y1="505" x2="1030" y2="560" stroke="#15181E" stroke-width="2" marker-end="url(#ah-ink)"/>
<line x1="600" y1="200" x2="360" y2="80" stroke="#15181E" stroke-width="2" marker-end="url(#ah-ink)"/>
</svg>
