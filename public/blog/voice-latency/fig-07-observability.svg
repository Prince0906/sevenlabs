<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 638" width="1000" height="638"><rect width="1000" height="638" fill="#F7F8FB"/><text x="28" y="34" font-size="20" font-weight="700" fill="#15181E" font-family="Arial, Helvetica, sans-serif">Observability today: real output from the running code</text><text x="28" y="54" font-size="13" fill="#5C6673" font-family="Arial, Helvetica, sans-serif">Local run, 24 Nov 2026. Copied from the terminal; long strings shortened where marked (the db container has a longer name).</text><text x="28" y="70" font-size="15" font-weight="700" fill="#15181E" font-family="Arial, Helvetica, sans-serif">1. One logger writes every line, and redacts first</text><rect x="28" y="82" width="944" height="138" rx="8" fill="#1B1F27"/><text x="46" y="108" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">// call (the key is a fake test string)</text><text x="46" y="128" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">log.info("minting session", { sessionId: "demo-1", apiKey: "sk-proj-FAKE...0123456789abcdef" })</text><text x="46" y="148" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">// what reaches stdout</text><text x="46" y="168" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">{"t":"2026-11-24T11:07:06.485Z","level":"info","msg":"minting session",</text><text x="46" y="188" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve"> "meta":"{\"sessionId\":\"demo-1\",\"apiKey\":\"sk-…cdef\"}"}</text><text x="28" y="256" font-size="15" font-weight="700" fill="#15181E" font-family="Arial, Helvetica, sans-serif">2. The readiness probe: healthy, then the database goes away</text><rect x="28" y="268" width="944" height="198" rx="8" fill="#1B1F27"/><text x="46" y="294" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">$ curl -si localhost:3000/api/health</text><text x="46" y="314" font-size="12.5" fill="#8EA2FF" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">HTTP/1.1 200 OK</text><text x="46" y="334" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">{"status":"healthy","db":true,"byok":false,"timestamp":"2026-11-24T11:06:57.871Z"}</text><text x="46" y="354" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve"></text><text x="46" y="374" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">$ docker stop db        # the database goes away</text><text x="46" y="394" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">$ curl -si localhost:3000/api/health</text><text x="46" y="414" font-size="12.5" fill="#FF7B80" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">HTTP/1.1 503 Service Unavailable</text><text x="46" y="434" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">{"status":"unavailable","db":false,"byok":false,"timestamp":"2026-11-24T11:07:00.562Z"}</text><text x="28" y="502" font-size="15" font-weight="700" fill="#15181E" font-family="Arial, Helvetica, sans-serif">3. ...and the server's own log line for the same moment</text><rect x="28" y="514" width="944" height="98" rx="8" fill="#1B1F27"/><text x="46" y="540" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">{"t":"2026-11-24T11:07:00.562Z","level":"error",</text><text x="46" y="560" font-size="12.5" fill="#E6E9F0" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve"> "msg":"[GET /api/health] database unreachable","meta":"PrismaClientKnownRequestError: ..."}</text><text x="46" y="580" font-size="12.5" fill="#8B94A3" font-family="Menlo, Monaco, 'Courier New', monospace" xml:space="preserve">// error text shortened: the full line carries local file paths</text></svg>
